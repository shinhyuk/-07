<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Trending - 주간 & 월간 인기 저장소</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface-hover: #1c2129;
      --border: #30363d;
      --text: #e6edf3;
      --text-secondary: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #79b8ff;
      --star: #e3b341;
      --fork: #8b949e;
      --lang-dot: #f1e05a;
      --weekly-accent: #da3633;
      --monthly-accent: #a371f7;
      --badge-bg: rgba(88, 166, 255, 0.1);
      --skeleton: #21262d;
      --skeleton-shine: #30363d;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 24px 16px;
      text-align: center;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--monthly-accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }

    .header p {
      color: var(--text-secondary);
      font-size: 14px;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    .sections {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    @media (max-width: 768px) {
      .sections { grid-template-columns: 1fr; }
    }

    .section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }

    .section-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .section-icon.weekly {
      background: rgba(218, 54, 51, 0.15);
      color: var(--weekly-accent);
    }

    .section-icon.monthly {
      background: rgba(163, 113, 247, 0.15);
      color: var(--monthly-accent);
    }

    .section-header h2 {
      font-size: 16px;
      font-weight: 700;
    }

    .section-header .period {
      font-size: 12px;
      color: var(--text-secondary);
      margin-left: auto;
    }

    .repo-list {
      list-style: none;
    }

    .repo-item {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
      cursor: pointer;
      position: relative;
    }

    .repo-item:last-child {
      border-bottom: none;
    }

    .repo-item:hover {
      background: var(--surface-hover);
    }

    .repo-item a {
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .repo-rank {
      position: absolute;
      top: 16px;
      right: 20px;
      font-size: 28px;
      font-weight: 800;
      color: var(--border);
      line-height: 1;
    }

    .repo-name {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
      padding-right: 36px;
    }

    .repo-name .owner {
      color: var(--accent);
      font-size: 14px;
      font-weight: 400;
    }

    .repo-name .slash {
      color: var(--text-secondary);
      font-size: 14px;
    }

    .repo-name .name {
      color: var(--accent);
      font-size: 14px;
      font-weight: 600;
    }

    .repo-desc {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 10px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.5;
      padding-right: 36px;
    }

    .repo-meta {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .lang-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .star-icon, .fork-icon {
      font-size: 14px;
    }

    .stars-period {
      color: var(--star);
      font-weight: 600;
      font-size: 11px;
      background: rgba(227, 179, 65, 0.1);
      padding: 2px 8px;
      border-radius: 10px;
    }

    /* Loading skeleton */
    .skeleton-item {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }

    .skeleton-item:last-child {
      border-bottom: none;
    }

    .skeleton-line {
      height: 14px;
      border-radius: 4px;
      background: linear-gradient(90deg, var(--skeleton) 25%, var(--skeleton-shine) 50%, var(--skeleton) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }

    .skeleton-line.short { width: 40%; margin-bottom: 8px; }
    .skeleton-line.medium { width: 70%; margin-bottom: 8px; }
    .skeleton-line.long { width: 90%; margin-bottom: 10px; }
    .skeleton-line.tiny { width: 25%; height: 12px; }

    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    .error-msg {
      padding: 32px 20px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 14px;
    }

    .error-msg .retry-btn {
      margin-top: 12px;
      padding: 8px 16px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 600;
    }

    .error-msg .retry-btn:hover {
      background: var(--accent-hover);
    }

    .refresh-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding: 0 4px;
    }

    .refresh-bar .last-updated {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .refresh-bar .refresh-btn {
      padding: 6px 14px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
      font-weight: 500;
    }

    .refresh-bar .refresh-btn:hover {
      background: var(--surface);
      border-color: var(--text-secondary);
    }

    .refresh-bar .refresh-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .footer {
      text-align: center;
      padding: 32px 16px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .footer a {
      color: var(--accent);
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>GitHub Trending</h1>
    <p>주간 & 월간 가장 인기 있는 저장소 TOP 5</p>
  </div>

  <div class="container">
    <div class="refresh-bar">
      <span class="last-updated" id="lastUpdated"></span>
      <button class="refresh-btn" id="refreshBtn" onclick="loadAll()">새로고침</button>
    </div>

    <div class="sections">
      <!-- Weekly -->
      <div class="section">
        <div class="section-header">
          <div class="section-icon weekly">🔥</div>
          <h2>주간 인기</h2>
          <span class="period">This Week</span>
        </div>
        <ul class="repo-list" id="weeklyList">
          <!-- loading -->
        </ul>
      </div>

      <!-- Monthly -->
      <div class="section">
        <div class="section-header">
          <div class="section-icon monthly">🏆</div>
          <h2>월간 인기</h2>
          <span class="period">This Month</span>
        </div>
        <ul class="repo-list" id="monthlyList">
          <!-- loading -->
        </ul>
      </div>
    </div>

    <div class="footer">
      Data from <a href="https://github.com/trending" target="_blank" rel="noopener">GitHub Trending</a>
    </div>
  </div>

  <script>
    const LANG_COLORS = {
      JavaScript: '#f1e05a', TypeScript: '#3178c6', Python: '#3572A5',
      Java: '#b07219', Go: '#00ADD8', Rust: '#dea584', C: '#555555',
      'C++': '#f34b7d', 'C#': '#178600', Ruby: '#701516', PHP: '#4F5D95',
      Swift: '#F05138', Kotlin: '#A97BFF', Dart: '#00B4AB', Lua: '#000080',
      Shell: '#89e051', HTML: '#e34c26', CSS: '#563d7c', Vue: '#41b883',
      Svelte: '#ff3e00', Zig: '#ec915c', Scala: '#c22d40', R: '#198CE7',
      Jupyter: '#DA5B0B', Elixir: '#6e4a7e', Haskell: '#5e5086',
    };

    function showLoading(listEl) {
      let html = '';
      for (let i = 0; i < 5; i++) {
        html += `<li class="skeleton-item">
          <div class="skeleton-line short"></div>
          <div class="skeleton-line long"></div>
          <div class="skeleton-line tiny"></div>
        </li>`;
      }
      listEl.innerHTML = html;
    }

    function showError(listEl, msg) {
      listEl.innerHTML = `<li class="error-msg">
        ${msg || '데이터를 불러올 수 없습니다.'}
        <br><button class="retry-btn" onclick="loadAll()">다시 시도</button>
      </li>`;
    }

    function sanitize(str) {
      if (!str) return '';
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    function formatNumber(n) {
      if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
      return String(n);
    }

    function renderRepos(listEl, repos) {
      if (!repos || repos.length === 0) {
        showError(listEl, '트렌딩 저장소를 찾을 수 없습니다.');
        return;
      }

      listEl.innerHTML = repos.slice(0, 5).map((repo, i) => {
        const langColor = LANG_COLORS[repo.language] || '#8b949e';
        const fullName = repo.full_name || `${repo.owner}/${repo.name}`;
        const [owner, name] = fullName.split('/');
        const url = repo.html_url || `https://github.com/${fullName}`;

        return `<li class="repo-item">
          <a href="${sanitize(url)}" target="_blank" rel="noopener">
            <span class="repo-rank">${i + 1}</span>
            <div class="repo-name">
              <span class="owner">${sanitize(owner)}</span>
              <span class="slash">/</span>
              <span class="name">${sanitize(name)}</span>
            </div>
            <div class="repo-desc">${sanitize(repo.description)}</div>
            <div class="repo-meta">
              ${repo.language ? `<span class="meta-item">
                <span class="lang-dot" style="background:${langColor}"></span>
                ${sanitize(repo.language)}
              </span>` : ''}
              <span class="meta-item">
                <span class="star-icon">&#9733;</span>
                ${formatNumber(repo.stargazers_count)}
              </span>
              <span class="meta-item">
                <span class="fork-icon">&#9741;</span>
                ${formatNumber(repo.forks_count)}
              </span>
              ${repo.period_stars ? `<span class="stars-period">
                +${formatNumber(repo.period_stars)} stars
              </span>` : ''}
            </div>
          </a>
        </li>`;
      }).join('');
    }

    async function fetchTrending(since) {
      // GitHub Search API: stars gained in period
      const now = new Date();
      let dateStr;

      if (since === 'weekly') {
        const d = new Date(now);
        d.setDate(d.getDate() - 7);
        dateStr = d.toISOString().split('T')[0];
      } else {
        const d = new Date(now);
        d.setDate(d.getDate() - 30);
        dateStr = d.toISOString().split('T')[0];
      }

      // Search repos created or pushed recently, sorted by stars
      const query = `created:>${dateStr}`;
      const url = `https://api.github.com/search/repositories?q=${encodeURIComponent(query)}&sort=stars&order=desc&per_page=5`;

      const resp = await fetch(url, {
        headers: { 'Accept': 'application/vnd.github.v3+json' }
      });

      if (!resp.ok) {
        throw new Error(`GitHub API: ${resp.status}`);
      }

      const data = await resp.json();
      return (data.items || []).map(repo => ({
        full_name: repo.full_name,
        html_url: repo.html_url,
        description: repo.description,
        language: repo.language,
        stargazers_count: repo.stargazers_count,
        forks_count: repo.forks_count,
        period_stars: repo.stargazers_count, // all stars are from the period since repo is new
      }));
    }

    async function loadSection(listEl, since) {
      showLoading(listEl);
      try {
        const repos = await fetchTrending(since);
        renderRepos(listEl, repos);
      } catch (err) {
        console.error(err);
        showError(listEl, `오류: ${err.message}`);
      }
    }

    async function loadAll() {
      const btn = document.getElementById('refreshBtn');
      btn.disabled = true;
      btn.textContent = '로딩 중...';

      await Promise.all([
        loadSection(document.getElementById('weeklyList'), 'weekly'),
        loadSection(document.getElementById('monthlyList'), 'monthly'),
      ]);

      const now = new Date();
      const timeStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
      document.getElementById('lastUpdated').textContent = `마지막 업데이트: ${timeStr}`;

      btn.disabled = false;
      btn.textContent = '새로고침';
    }

    loadAll();
  </script>
</body>
</html>
